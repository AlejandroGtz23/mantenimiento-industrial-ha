upstream backend_pool {
    least_conn;
    server backend-1:8081 max_fails=3 fail_timeout=10s;
    server backend-2:8081 max_fails=3 fail_timeout=10s;
}

upstream demo_pool {
    # Round-robin por defecto: cada recarga puede llegar a una réplica distinta.
    server demo-1:80;
    server demo-2:80;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;

    location /api/ {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Las dos réplicas comparten el mismo volumen de evidencias.
    location /uploads/ {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=3600";
    }

    # Página pensada para la demostración ante el profesor.
    location /balance-test/ {
        proxy_pass http://demo_pool/;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
